name: Build, verify and publish book
on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'lab/**'
      - 'tests/**'
      - 'scripts/**'
      - 'web/**'
      - 'epub/**'
      - 'go.mod'
      - 'go.sum'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.12.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start real Keycloak identity service
        run: |
          docker run -d --name book-keycloak -p 127.0.0.1:9180:8080 -v "$PWD/lab/keycloak-realm.json:/opt/keycloak/data/import/book.json:ro" quay.io/keycloak/keycloak:26.2.5 start-dev --import-realm
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9180/realms/book/.well-known/openid-configuration > /tmp/keycloak-discovery.json; then exit 0; fi
            sleep 2
          done
          docker logs book-keycloak
          exit 1
      - name: Run signed HTTP, business authorization and real Keycloak tests
        env:
          KEYCLOAK_REALM_URL: http://127.0.0.1:9180/realms/book
        run: go test -race -count=1 -v ./lab
      - name: Build all reading formats
        run: python3 scripts/build.py
      - name: Verify manuscript and experiment archive integrity
        run: python3 scripts/verify.py
      - name: Unpack and run the downloadable experiment
        run: |
          mkdir /tmp/book-unpacked
          unzip -q site/downloads/lab.zip -d /tmp/book-unpacked
          cd /tmp/book-unpacked
          go test -race -count=1 ./lab
      - name: Validate EPUB 3
        run: sh scripts/epubcheck.sh
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify reader and all mobile chapters
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory site > /tmp/book-http.log 2>&1 &
          node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: book-downloads
          path: site/downloads/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
